# Single-port terminator: 8888 -> client (Vite) + server (Express /api).
# WebSocket upgrade headers are set on both locations so Vite HMR survives
# the proxy hop.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;
    server_name _;

    # Re-resolve container addresses at request time. Without this nginx
    # caches the address from config-load and 502s forever once a container
    # is recreated on a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # nginx defaults to 1m; server MAX_UPLOAD_BYTES defaults to 10 MB (+ multipart overhead).
    client_max_body_size 12m;

    # Disable dev caching so hot reloads land immediately.
    add_header Cache-Control 'no-store' always;

    location /api/ {
        set $fdev_upstream_server_1 "http://server:3001";
        proxy_pass $fdev_upstream_server_1$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        set $fdev_upstream_client_2 "http://client:5173";
        proxy_pass $fdev_upstream_client_2$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
